services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wacrm
      POSTGRES_PASSWORD: wacrm
      POSTGRES_DB: wacrm
    ports:
      - "5432:5432"
    volumes:
      - wacrm_pg:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://wacrm:wacrm@db:5432/wacrm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_LOCALE: pt-BR
    depends_on:
      - db

volumes:
  wacrm_pg:
