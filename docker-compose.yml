services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wacrm
      POSTGRES_PASSWORD: wacrm
      POSTGRES_DB: wacrm
    ports:
      - "5432:5432"
    volumes:
      - wacrm_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://wacrm:wacrm@db:5432/wacrm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      WEB_ORIGIN: http://localhost:3000
      PORT: "4000"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://wacrm:wacrm@db:5432/wacrm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - api
      - db

volumes:
  wacrm_pg:
