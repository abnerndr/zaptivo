services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zapp_root
      POSTGRES_PASSWORD: zapp
      POSTGRES_DB: zapp_db
    ports:
      - "5432:5432"
    volumes:
      - zapp_pg:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://zapp_root:zapp@db:5432/zapp_db?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_LOCALE: pt-BR
    depends_on:
      - db

volumes:
  zapp_pg:
