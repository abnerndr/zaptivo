# Deprecated for Dokploy: use Dockerfiles in apps/web and apps/api instead.
# Kept temporarily for reference. Prefer:
#   - apps/web/Dockerfile  (port 3000)
#   - apps/api/Dockerfile  (port 4000)
#
# See docs/dokploy.md

providers = ["node"]

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["...", "openssl"]

[phases.install]
cmds = ["echo 'Use Dockerfile deploy (apps/web + apps/api) on Dokploy' && exit 1"]
